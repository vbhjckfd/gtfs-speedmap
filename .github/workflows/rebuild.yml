# Weekly: fold the days since the last run into the map and republish it.
#
# One runner per month being built, each on its own days only, so memory stays
# at one month's worth however long the archive grows. A finished month is
# built once: its map files are kept in R2 (derived/web/, see sync.py) and the
# deploy gathers every month from there, so a normal run rebuilds only the
# month that is still running.
#
# Start by hand with months "all" to rebuild everything — after a change to
# the build, or the first time — or a space-separated list such as "2026-07".
name: Rebuild

on:
  schedule:
    # 02:00 UTC on the 1st, 8th, 15th and 22nd. Ingest stops at yesterday by
    # UTC, so the running month is a whole number of weeks in — 1/4, 1/2, 3/4 —
    # and the run on the 1st closes the month just finished.
    - cron: "0 2 1,8,15,22 * *"
  workflow_dispatch:
    inputs:
      months:
        description: '"all", or YYYY-MM separated by spaces; empty for the latest one or two'
        required: false
        default: ""

concurrency:
  group: rebuild
  cancel-in-progress: false

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ vars.R2_BUCKET || 'gtfs-lviv' }}
  PYTHONPATH: src

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      months: ${{ steps.months.outputs.months }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - id: months
        env:
          WANTED: ${{ inputs.months }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timedelta, timezone
          from speedmap import r2

          wanted = os.environ.get("WANTED", "").split()
          if wanted == ["all"]:
              today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              months = sorted({d[:7] for d in r2.raw_dates(r2.make_client()) if d < today})
          elif wanted:
              months = wanted
          else:
              # The month of yesterday, and of the previous run's yesterday: if
              # the run on the 1st failed, the next one still closes the month
              # just finished instead of leaving it at 3/4.
              now = datetime.now(timezone.utc)
              months = sorted({(now - timedelta(days=d)).strftime("%Y-%m") for d in (1, 8)})
          print(f"months={json.dumps(months)}")
          EOF

  month:
    needs: plan
    runs-on: ubuntu-24.04
    # About two minutes a day at JOBS=3: a week is a quarter of an hour, a
    # month from scratch about an hour.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        month: ${{ fromJson(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Pull the month's aggregates from R2
        run: python -m speedmap.sync pull --month ${{ matrix.month }}

      - name: Ingest its new days
        run: python -m speedmap.ingest --month ${{ matrix.month }}

      # Even when some days failed: the ones that finished are kept, and the
      # next run only has the failures left to do.
      - name: Push aggregates to R2
        if: ${{ !cancelled() }}
        run: python -m speedmap.sync push

      - name: Build the month
        run: python -m speedmap.build_web --month ${{ matrix.month }} --no-index

      - name: Keep the built month in R2
        run: python -m speedmap.sync push-web --month ${{ matrix.month }}

  deploy:
    needs: [plan, month]
    # A month that failed keeps its previous build in R2, so the rest still ship.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Gather every built month
        run: python -m speedmap.sync pull-web

      - name: Write the index
        run: python -m speedmap.build_web --index

      - run: npx --yes wrangler deploy
