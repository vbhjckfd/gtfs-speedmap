[project]
name = "gtfs-speedmap"
version = "0.1.0"
description = "Average bus speed map for Lviv, built from archived GTFS-RT vehicle positions"
readme = "README.md"
license = "WTFPL"
license-files = ["LICENSE"]
authors = [{ name = "Myroslav Holyak" }]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://gtfs-speedmap.vbhjckfd.workers.dev/"
Repository = "https://github.com/vbhjckfd/gtfs-speedmap"
dependencies = [
    "boto3>=1.34",
    "gtfs-realtime-bindings>=1.0",
    "protobuf>=4.25",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
